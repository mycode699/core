# V2 AI UI en-US translations — property-key lookup for runtime i18n.
# Format: domain.context.object_id.property_type = value
# Keys are derived from GtkBuilder context attributes and widget ids.
# When a C++ V2 widget loader needs an en-US label, it reads this file
# via a simple ConfigMap-like reader (kqoffice/source/ai/i18n/).
#
# See docs/product/v2/i18n-multilang-status.md for architecture overview.

